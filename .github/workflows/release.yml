name: Build and publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release versions
        shell: pwsh
        run: |
          $appVersion = python -c "from app_constants import APP_VERSION; print(APP_VERSION)"
          $expectedTag = "v$appVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME must match app version $expectedTag"
          }
          $installerVersionMatch = Select-String -Path installer\CS2Trening.iss -Pattern '^#define MyAppVersion "([^"]+)"'
          $installerVersion = $installerVersionMatch.Matches[0].Groups[1].Value
          if ($installerVersion -ne $appVersion) {
            throw "Installer version $installerVersion must match app version $appVersion"
          }

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --icon app_icon.ico --add-data "app_icon.ico;." --name CS2Trening main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CS2Trening.iss'

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/installer/CS2Trening-Setup.exe
